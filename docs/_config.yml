# Drop cap style for page bodies, sitewide (see _includes/dropcap.html):
#   plain   - ASCII initial
#   shadow  - ASCII initial in a shaded box
#   transit - transit line bullets (_data/transit_initials.yml), shaded ASCII
#             for letters without one
# A page can override it with `dropcap: <style>` in its front matter.
dropcap_style: transit

